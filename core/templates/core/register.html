<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Campus Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<div class="container" style="max-width: 460px;">
  <div class="card p-4 shadow-sm border-0">
    <h3 class="fw-bold text-center mb-3">Student Registration</h3>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-success w-100">Create Account</button>
    </form>
    <div class="text-center mt-3">
      <small>Already registered? <a href="{% url 'login' %}">Login</a></small>
    </div>
  </div>
</div>
</body>
</html>
